name: Production verification
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax and controller
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path './.git' -prune -o -path './experiments' -prune -o -name '*.js' -print0)
          node tests/intuitive/test_controller.cjs
      - name: Real HTTP touch and responsive browser checks
        run: |
          set -euo pipefail
          python -m http.server 4190 --bind 127.0.0.1 > /tmp/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4190/ > /dev/null
          python tests/intuitive/test_ui.py
          EVIDENCE_DIR=evidence/details python tests/intuitive/test_http_details.py
          EVIDENCE_DIR=evidence/source-cards python tests/source-water/test_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: |
            evidence/
            /tmp/site-server.log
          retention-days: 7
