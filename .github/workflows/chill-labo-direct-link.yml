name: Chill Labo direct-link migration

on:
  push:
    branches:
      - chill-labo-direct-link
    paths:
      - .github/workflows/chill-labo-direct-link.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace SAT internal Chill Labo links
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded = {
              Path('about/chill-labo/index.html'),
              Path('en/about/chill-labo/index.html'),
          }
          replacements = {
              'href="/about/chill-labo/"': 'href="https://chilllabo.tokyo/"',
              'href="/en/about/chill-labo/"': 'href="https://chilllabo.tokyo/"',
          }

          changed = []
          counts = {old: 0 for old in replacements}
          for path in Path('.').rglob('*.html'):
              rel = Path(path.as_posix().removeprefix('./'))
              if rel in excluded:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  counts[old] += updated.count(old)
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(rel))

          remaining = []
          for path in Path('.').rglob('*.html'):
              rel = Path(path.as_posix().removeprefix('./'))
              if rel in excluded:
                  continue
              text = path.read_text(encoding='utf-8')
              if any(old in text for old in replacements):
                  remaining.append(str(rel))

          print('replacement counts:', counts)
          print('changed files:', changed)
          if not changed:
              raise SystemExit('No SAT → internal Chill Labo links were found; refusing silent no-op.')
          if remaining:
              raise SystemExit(f'Internal Chill Labo links remain outside origin pages: {remaining}')
          PY

      - name: Commit full-file replacements and remove one-shot workflow
        run: |
          rm .github/workflows/chill-labo-direct-link.yml
          git config user.name "Toraikura"
          git config user.email "yoshiaki.aso@gmail.com"
          git add -A
          git commit -m "Route Chill Labo links to official site"
          git push origin HEAD:chill-labo-direct-link
